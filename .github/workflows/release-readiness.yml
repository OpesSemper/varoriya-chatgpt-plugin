name: Strict release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Verify server
        run: npm run typecheck && npm test && npm run build && npm audit --audit-level=high
        working-directory: server

      - name: Validate plugin package
        run: node scripts/validate-plugin.mjs

      - name: Enforce strict publisher and submission inputs
        run: node scripts/release/validate-submission.mjs

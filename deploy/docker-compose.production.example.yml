# Illustrative production composition. Use an approved secret manager or
# orchestration-native secret mount; this file intentionally contains no secrets.
services:
  varoriya-mcp:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ${VARORIYA_GATEWAY_IMAGE:?Set an approved immutable image digest}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Resolve required values through the deployment platform or secret manager.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the publisher-owned HTTPS origin}
      VARORIYA_AUTH_MODE: oauth
      VARORIYA_OAUTH_ISSUER: ${VARORIYA_OAUTH_ISSUER:?Set the approved issuer}
      VARORIYA_OAUTH_AUDIENCES: ${VARORIYA_OAUTH_AUDIENCES:?Set the MCP audience}
      VARORIYA_OAUTH_JWKS_URI: ${VARORIYA_OAUTH_JWKS_URI:?Set the public JWKS URI}
      VARORIYA_API_BASE_URL: ${VARORIYA_API_BASE_URL:?Set the approved Varoriya API origin}
      VARORIYA_API_TIMEOUT_MS: 15000
      DATABASE_URL: ${DATABASE_URL:?Inject the PostgreSQL URL through a secret manager}
      CLAMAV_HOST: ${CLAMAV_HOST:?Set the private scanner host}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      VARORIYA_MODEL_POLICIES_JSON: ${VARORIYA_MODEL_POLICIES_JSON:?Set the approved exact model policy}
      VARORIYA_COST_CURRENCY: ${VARORIYA_COST_CURRENCY:-CRD}
    ports:
      # Bind privately; place a managed TLS ingress/reverse proxy in front.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
